name: docs

on:
  push:
    branches: [main]
  # UTC 19:00 = 次日北京时间 03:00。
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: '可选：补拉开始日期（YYYY-MM-DD），留空为增量同步'
        type: string
        default: ''
      to:
        description: '可选：补拉结束日期（YYYY-MM-DD），留空为今天'
        type: string
        default: ''

permissions:
  contents: write

# 授权刷新和发布串行执行，避免两个任务互相覆盖 refresh token。
concurrency:
  group: blog-publish-main
  cancel-in-progress: false

jobs:
  docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test running data handling
        run: pnpm running:test

      - name: Restore COROS authorization
        id: restore
        if: github.event_name != 'push'
        env:
          COROS_STATE_KEY: ${{ secrets.COROS_STATE_KEY }}
        run: |
          if [ -z "$COROS_STATE_KEY" ]; then
            echo '::error::请先在仓库 Actions Secrets 中配置 COROS_STATE_KEY。'
            exit 1
          fi
          node scripts/running/auth-state.mjs unpack

      - name: Sync running activities
        id: sync
        if: github.event_name != 'push'
        env:
          SYNC_FROM: ${{ inputs.from }}
          SYNC_TO: ${{ inputs.to }}
        shell: bash
        run: |
          args=(--issuer https://mcpcn.coros.com)
          if [ -n "$SYNC_FROM" ]; then args+=(--from "$SYNC_FROM"); fi
          if [ -n "$SYNC_TO" ]; then args+=(--to "$SYNC_TO"); fi
          pnpm running:sync "${args[@]}"

      # 即使数据请求失败，也要保存可能已轮换的 refresh token。
      # 只有同步成功才提交活动 JSON，防止用半份数据覆盖线上页面。
      - name: Persist refreshed authorization and data
        if: always() && steps.restore.outcome == 'success'
        env:
          COROS_STATE_KEY: ${{ secrets.COROS_STATE_KEY }}
          COROS_ISSUER: https://mcpcn.coros.com
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          node scripts/running/auth-state.mjs pack
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/coros-auth.enc
          if [ "$SYNC_OUTCOME" = 'success' ]; then
            git add docs/.vuepress/public/running-data/activities.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync running data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build VuePress site
        run: pnpm docs:build

      - name: Add CNAME record
        env:
          TARGET_DOMAIN: ${{ secrets.TARGET_DOMAIN }}
        run: |
          if [ -n "$TARGET_DOMAIN" ]; then
            printf '%s\n' "$TARGET_DOMAIN" > docs/.vuepress/dist/CNAME
          fi

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs/.vuepress/dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
